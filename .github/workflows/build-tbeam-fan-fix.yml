name: DMC T-Beam 1W Fan Fix
on:
  push:
    branches: [fix/tbeam-1w-fan]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test fan timing and sleep handling
        run: |
          g++ -std=c++17 -Wall -Wextra -I tests/tbeam_fan/mocks -DSX126X_RXEN=21 tests/tbeam_fan/test_fan.cpp -o /tmp/test-tbeam-fan
          /tmp/test-tbeam-fan
      - name: Test PA ramp preservation
        run: |
          g++ -std=c++17 -Wall -Wextra -I tests/tbeam_fan/mocks tests/tbeam_fan/test_ramp.cpp -o /tmp/test-tbeam-ramp
          /tmp/test-tbeam-ramp
      - name: Test Ruhrgebiet factory profile
        run: |
          g++ -std=c++17 -Wall -Wextra -I tests/tbeam_fan/mocks tests/tbeam_fan/test_defaults.cpp -o /tmp/test-tbeam-defaults
          /tmp/test-tbeam-defaults
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Verify effective repeater build flags
        run: |
          pio project config --json-output > /tmp/pio-config.json
          python3 - <<'PY'
          import json, shlex
          config = dict(json.load(open('/tmp/pio-config.json')))
          flags = dict(config['env:LilyGo_TBeam_1W_repeater'])['build_flags']
          definitions = {}
          for flag in flags:
              tokens = shlex.split(flag)
              option = ''.join(tokens)
              if option.startswith('-D'):
                  name, _, value = option[2:].partition('=')
                  definitions[name] = value or '1'
              elif option.startswith('-U'):
                  definitions.pop(option[2:], None)
          assert definitions['DMC_RUHR_DEFAULTS'] == '1'
          assert definitions['LORA_CR'] == '8'
          assert definitions['ENABLE_ADVERT_ON_BOOT'] == '0'
          assert definitions['SX126X_RX_BOOSTED_GAIN'] == '1'
          PY
      - name: Build DMC repeater for T-Beam 1W
        env:
          FIRMWARE_VERSION: v1.17.1-ruhr
        run: bash build.sh build-firmware LilyGo_TBeam_1W_repeater
      - name: Verify firmware outputs
        run: |
          test -s .pio/build/LilyGo_TBeam_1W_repeater/firmware.bin
          test -s .pio/build/LilyGo_TBeam_1W_repeater/firmware-merged.bin
          cd out
          sha256sum *.bin > SHA256SUMS.txt
      - name: Upload flashable firmware
        uses: actions/upload-artifact@v7
        with:
          name: DMC-Repeater-v1.17.1-TBeam-1W-Ruhrgebiet
          path: out/
          if-no-files-found: error
